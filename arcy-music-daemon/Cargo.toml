[package]
name = "arcy-music-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
arcy-music-core = { version = "0.1.0", path = "../arcy-music-core" }
axum = "0.8.9"
base64 = "0.23.1"
dirs = "7.0.0"
image = "0.25.10"
lofty = "0.25.4"
reqwest = { version = "0.13.5", features = ["json"] }
rodio = "0.22.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
walkdir = "2.5.0"
mpris-server = "0.10.0"
rand = "0.9"
