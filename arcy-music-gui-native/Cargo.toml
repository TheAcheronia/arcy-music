[package]
name = "arcy-music-gui-native"
version = "0.1.0"
edition = "2024"

[dependencies]
arcy-music-core = { version = "0.1.0", path = "../arcy-music-core" }
chrono = "0.4"
dirs = "7.0.0"
futures-util = "0.3.34"
image = "0.25.10"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[build-dependencies]
slint-build = "1.18.1"
