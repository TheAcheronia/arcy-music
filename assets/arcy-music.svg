<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0b0b10" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#383854" stroke-width="4" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Vinyl / Waveform Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#252538" stroke-width="3" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#31314a" stroke-width="2" />

  <!-- Center Stylized Music Symbol (Beamed Eighth Notes + Arc) -->
  <g filter="url(#glow)">
    <!-- Arc Accent (The "Arcy" Arc) -->
    <path d="M 150 180 A 130 130 0 0 1 362 180" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Music Note Stems and Beam -->
    <!-- Left Note Stem -->
    <rect x="200" y="190" width="14" height="135" rx="7" fill="url(#accentGrad)" />
    <!-- Right Note Stem -->
    <rect x="290" y="150" width="14" height="175" rx="7" fill="url(#accentGrad)" />
    <!-- Top Beam -->
    <path d="M 200 200 L 304 160 L 304 185 L 200 225 Z" fill="url(#accentGrad)" />

    <!-- Left Notehead -->
    <ellipse cx="185" cy="325" rx="35" ry="24" transform="rotate(-25 185 325)" fill="url(#accentGrad)" />
    <!-- Right Notehead -->
    <ellipse cx="275" cy="325" rx="35" ry="24" transform="rotate(-25 275 325)" fill="url(#accentGrad)" />

    <!-- Sparkle Highlights -->
    <circle cx="340" cy="140" r="6" fill="#FFFFFF" />
    <circle cx="160" cy="300" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
