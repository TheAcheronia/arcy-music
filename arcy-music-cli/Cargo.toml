[package]
name = "arcy-music-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
arcy-music-core = { version = "0.1.0", path = "../arcy-music-core" }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
serde_json = "1.0.151"
dirs = "7.0.0"
